pipelines:
  definitions:
    - step: &install_and_test
        name: Install and run tests
        image: node:24
        caches:
          - node
        script:
          - corepack enable
          - corepack prepare yarn@1.22.22 --activate
          - yarn install --frozen-lockfile
          - yarn verify
          - yarn audit:dependencies
    - step: &build
        name: Build Project
        image: node:24
        deployment: test
        caches:
          - node
        artifacts:
          - build/**
        script:
          - corepack enable
          - corepack prepare yarn@1.22.22 --activate
          - yarn install --frozen-lockfile
          - yarn build
    - step: &build_storybook
        size: 2x
        name: Build Storybook
        image: node:24
        caches:
          - node
        artifacts:
          - storybook-static/**
        script:
          - corepack enable
          - corepack prepare yarn@1.22.22 --activate
          - yarn install --frozen-lockfile
          - yarn build-storybook
    - step: &deploy_test
        name: Deploy to develop
        trigger: manual
        image: atlassian/pipelines-awscli
        artifacts:
          - build/**
          - storybook-static/**
        script:
          - cd build
          - aws s3 sync . s3://forest-watcher-web-client-dev
          - cd ../storybook-static
          - aws s3 sync . s3://forest-watcher-storybook-dev
          - aws cloudfront create-invalidation --distribution-id E3I4LK8QQA91ZN --paths "/*"
          - aws cloudfront create-invalidation --distribution-id E1JIEU8SN5K226 --paths "/*"
    - step: &deploy_staging
        name: Deploy to staging
        trigger: manual
        image: atlassian/pipelines-awscli
        artifacts:
          - build/**
        script:
          - cd build
          - aws s3 sync . s3://forest-watcher-web-client-staging
          - aws cloudfront create-invalidation --distribution-id E3UEJWTVPP1UFQ --paths "/*"
  pull-requests:
    "**":
      - step: *install_and_test
      - parallel:
          - step: *build
          - step: *build_storybook
  branches:
    develop:
      - step: *install_and_test
      - parallel:
          - step: *build
          - step: *build_storybook
      - step: *deploy_test
    master:
      - step: *install_and_test
      - step:
          <<: *build
          deployment: staging
      - step: *deploy_staging
